name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # matches v1.2.3, v1.2.3+1, v1.2.3-beta.1

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    # Required for OIDC-based trusted publishing on pub.dev.
    # No PUB_TOKEN secret needed — configure this repo as a trusted
    # publisher at https://pub.dev/packages/flutter_full_router/admin
    permissions:
      id-token: write   # required for OIDC
      contents: write   # required to push the version bump commit

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          # Checkout the branch, not the tag, so we can push a commit back
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Bump pubspec version to match tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Applying version: $VERSION"
          sed -i "s/^version:.*/version: $VERSION/" pubspec.yaml
          grep '^version:' pubspec.yaml
        shell: bash

      - name: Commit and push version bump
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          # Skip commit if pubspec was already at the right version
          if git diff --staged --quiet; then
            echo "pubspec.yaml already at $VERSION — no commit needed."
          else
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push origin ${{ github.event.repository.default_branch }}
          fi
        shell: bash

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Publish (dry-run)
        run: dart pub publish --dry-run

      - name: Publish
        uses: dart-lang/pub-dev-action@v1
