name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # matches v1.2.3, v1.2.3+1, v1.2.3-beta.1

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    # Required for authentication using OIDC on pub.dev
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the tag that triggered the workflow
          ref: ${{ github.ref }}
      - name: Setup Dart (for pub.dev OIDC authentication)
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bump pubspec version to match tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Applying version: $VERSION"
          sed -i "s/^version:.*/version: $VERSION/" pubspec.yaml
          grep '^version:' pubspec.yaml
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Verify test passed
        run: flutter test

      - name: Publish to pub.dev
        run: dart pub publish -f

      - name: Upload modified pubspec files
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-updates
          path: |
            pubspec.yaml
            pubspec.lock
          retention-days: 1

  save:
    name: Save Version Bump
    needs: publish
    runs-on: ubuntu-latest

    # Required for pushing the commit back
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          # We need to checkout the main branch so we can commit directly to it
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download modified pubspec files from publish job
        uses: actions/download-artifact@v4
        with:
          name: pubspec-updates

      - name: Commit and push changes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock

          # Skip commit if files were already at the right version
          if git diff --staged --quiet; then
            echo "Files already at $VERSION — no commit needed."
          else
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push origin ${{ github.event.repository.default_branch }}
            
            # Re-tag the new auto-commit with the exact version tag that triggered this action
            git tag -f ${{ github.ref_name }}
            git push origin -f refs/tags/${{ github.ref_name }}
          fi
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
